[project]
name = "gesturecap2025"
version = "0.1.0"
description = "Local MediaPipe hand tracker that sends hand landmarks over OSC"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "mediapipe==0.10.14",
    "opencv-python-headless==4.13.0.92",
    "python-osc>=1.10.2",
]

[tool.uv]
# MediaPipe 0.10.14 declares packages the hand tracker never uses.
# These overrides keep them out (see utils/no_matplotlib.py and requirements.txt).
override-dependencies = [
    "jax; sys_platform == 'never'",
    "jaxlib; sys_platform == 'never'",
    "matplotlib; sys_platform == 'never'",
    "sounddevice; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
]
